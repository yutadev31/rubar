[package]
name = "rubar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.14"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
memmap2 = "0.9"
tempfile = "3"
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
