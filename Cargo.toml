[workspace]
resolver = "3"
members = ["crates/cpst", "crates/rubar", "crates/shell-surface"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = {
  version = "0.4",
  default-features = false,
  features = [
    "clock",
    "std",
  ]
}
chrono-tz = { version = "0.10", features = ["serde"] }
cosmic-text = "0.19"
dirs = "7"
libpulse-binding = "2.30"
memmap2 = "0.9"
png = "0.18"
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-surface.path = "crates/shell-surface"
socket2 = "0.6"
tempfile = "3"
tiny-skia = "0.12"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
zbus = {
  version = "5",
  default-features = false,
  features = [
    "async-io",
    "blocking-api",
  ]
}
