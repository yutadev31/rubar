[package]
name = "rubar"
version = "0.3.0"
edition = "2024"

[dependencies]
chrono = {
  version = "0.4",
  default-features = false,
  features = [
    "clock",
    "std",
  ]
}
chrono-tz = { version = "0.10", features = ["serde"] }
cosmic-text = "0.19"
dirs = "7"
libpulse-binding = "2.30"
png = "0.18"
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-surface = { git = "https://github.com/yutadev31/shell-surface.git", rev = "247b682dbeff5b0b3726ec8291d6514d2a8a574a" }
tiny-skia = "0.12"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"
x11rb = "0.14"
zbus = {
  version = "5",
  default-features = false,
  features = [
    "async-io",
    "blocking-api",
  ]
}

[dev-dependencies]
tempfile = "3"
