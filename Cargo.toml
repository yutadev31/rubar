[package]
name = "rubar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
cosmic-text = "0.19"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libpulse-binding = "2.30"
tiny-skia = "0.12"
png = "0.18"
resvg = "0.48.1"
zbus = { version = "5", default-features = false, features = [
  "async-io",
  "blocking-api",
] }
shell-surface = { git = "https://github.com/yutadev31/shell-surface.git", rev = "f1c92ce1d201699ccd5627bcaecef28fbeb0787a" }

[dev-dependencies]
tempfile = "3"
